[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/parser",
    "crates/compiler",
    "crates/runtime",
    "crates/std",
    "crates/typecheck",
    "crates/codegen",
    "crates/resolver",
    "crates/formatter",
    "crates/diagnostics",
]

[workspace.dependencies]
thiserror = "2"
miette = { version = "7", default-features = false, features = ["derive"] }
