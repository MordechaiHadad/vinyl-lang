[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/parser",
    "crates/compiler",
    "crates/runtime",
    "crates/std",
    "crates/typecheck",
    "crates/codegen",
    "crates/resolver",
    "crates/formatter",
    "crates/diagnostics",
    "crates/lsp",
]

[workspace.dependencies]
thiserror = "2"
miette = { version = "7", default-features = false, features = ["derive"] }
eyre = "0.6"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
line-index = "0.1.2"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
