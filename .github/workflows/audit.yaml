name: Security Audit

on:
  push:
    paths:
      - 'compiler/Cargo.toml'
      - 'compiler/Cargo.lock'
  pull_request:
    paths:
      - 'compiler/Cargo.toml'
      - 'compiler/Cargo.lock'

jobs:
  audit:
    name: Run cargo-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v1

      - name: Run security audit
        run: just audit-ci
