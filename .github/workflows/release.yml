name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify-versions:
    name: Verify Version Alignment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate component versions match tag
        run: |
          python3 scripts/check-release-versions.py "$GITHUB_REF_NAME"

  build-release:
    name: Build & Package (${{ matrix.target }})
    needs: verify-versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binaries (CLI & LSP)
        run: |
          cargo build --release --manifest-path compiler/Cargo.toml --target ${{ matrix.target }} -p vinyl-cli -p vinyl-lsp

      - name: Package Unix Assets
        if: matrix.os != 'windows-latest'
        run: |
          cd compiler/target/${{ matrix.target }}/release
          CLI_BIN=$(test -f vinyl && echo "vinyl" || echo "cli")
          LSP_BIN=$(test -f vinyl-lsp && echo "vinyl-lsp" || echo "lsp")
          tar -czf ../../../../vinyl-${{ matrix.target }}.tar.gz "$CLI_BIN"
          tar -czf ../../../../vinyl-lsp-${{ matrix.target }}.tar.gz "$LSP_BIN"

      - name: Package Windows Assets
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd compiler/target/${{ matrix.target }}/release
          $CliBin = if (Test-Path "vinyl.exe") { "vinyl.exe" } else { "cli.exe" }
          $LspBin = if (Test-Path "vinyl-lsp.exe") { "vinyl-lsp.exe" } else { "lsp.exe" }
          Compress-Archive -Path $CliBin -DestinationPath ../../../../vinyl-${{ matrix.target }}.zip
          Compress-Archive -Path $LspBin -DestinationPath ../../../../vinyl-lsp-${{ matrix.target }}.zip

      - name: Package VS Code Extension (.vsix)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd editor/vscode
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npx @vscode/vsce package --out ../../vinyl-vscode-${{ github.ref_name }}.vsix

      - name: Build Zed Extension
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-wasip2
          cargo build --release --manifest-path editor/zed/Cargo.toml --target wasm32-wasip2
          mkdir -p zed-extension
          cp editor/zed/extension.toml zed-extension/
          cp -r editor/zed/languages zed-extension/
          cp editor/zed/target/wasm32-wasip2/release/vinyl_zed.wasm zed-extension/extension.wasm
          cd zed-extension
          zip -r ../vinyl-zed-${{ github.ref_name }}.zip extension.toml languages extension.wasm

      - name: Build JetBrains Plugin
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: matrix.os == 'ubuntu-latest'
        uses: gradle/actions/setup-gradle@v4

      - name: Package JetBrains Plugin
        if: matrix.os == 'ubuntu-latest'
        run: |
          gradle -p editor/jetbrains/lsp-plugin buildPlugin --no-daemon
          cp editor/jetbrains/lsp-plugin/build/distributions/*.zip vinyl-jetbrains-${{ github.ref_name }}.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            vinyl-${{ matrix.target }}.${{ matrix.archive_ext }}
            vinyl-lsp-${{ matrix.target }}.${{ matrix.archive_ext }}
            vinyl-vscode-*.vsix
            vinyl-zed-*.zip
            vinyl-jetbrains-*.zip
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all matrix build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
