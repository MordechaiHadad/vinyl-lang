[package]
name = "vinyl-lsp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vinyl-lsp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
eyre = "0.6"
line-index = "0.1.2"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
vinyl-formatter = { path = "../compiler/crates/formatter" }
vinyl-parser = { path = "../compiler/crates/parser" }
vinyl-resolver = { path = "../compiler/crates/resolver" }
vinyl-typecheck = { path = "../compiler/crates/typecheck" }

[dev-dependencies]
serde_json = "1.0.151"
